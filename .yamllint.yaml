---
extends: default

ignore: |
  charts/*/templates/
  infra/modules/*/charts/*/templates/
  .terraform/
  .serena/

rules:
  document-start: disable
  line-length:
    max: 160
    level: warning
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false # GitHub Actions uses the bare `on:` key
