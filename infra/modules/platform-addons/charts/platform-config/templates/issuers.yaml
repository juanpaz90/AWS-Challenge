# Self-signed root → local CA certificate → CA ClusterIssuer used for every local certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: {{ .Values.certManager.namespace }}
spec:
  isCA: true
  commonName: {{ printf "%s local CA" .Values.domain | quote }}
  secretName: local-ca
  duration: 87600h # 10 years: throwaway local CA
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca
spec:
  ca:
    secretName: local-ca
