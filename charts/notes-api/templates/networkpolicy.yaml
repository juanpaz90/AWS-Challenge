{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if $np.namespaceDefaultDeny }}
# Namespace-wide default deny: nothing in or out unless another policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    {{- include "notes-api.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Every pod in the namespace may resolve names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    {{- include "notes-api.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{- end }}
# API pods: reachable only from the Gateway's Envoy proxies (traffic) and Prometheus
# (/metrics); may only open connections to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "notes-api.fullname" . }}-api
  labels:
    {{- include "notes-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "notes-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.gateway.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.gateway.podLabels | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoring.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.monitoring.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.database.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
---
# Migration Job pods: no ingress at all; egress to the database only.
# The database side ("allow this release → 5432") belongs to the database owner, because it
# must exist before the pre-install migration hook runs (see README).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "notes-api.fullname" . }}-migration
  labels:
    {{- include "notes-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "notes-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.database.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
{{- end }}
