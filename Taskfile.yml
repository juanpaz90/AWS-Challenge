# Task runner — https://taskfile.dev
# `task` lists all targets. Placeholder targets fail on purpose until their phase lands,
# so nothing (including CI) can mistake "not implemented" for "passed".
version: "3"

vars:
  IMAGE: notes-api
  VCS_REF:
    sh: git rev-parse HEAD
  # Short SHA; "-dirty" when app/ has uncommitted changes, so a tag never lies about its source.
  IMAGE_TAG:
    sh: tag="$(git rev-parse --short HEAD)"; [ -z "$(git status --porcelain -- app)" ] || tag="${tag}-dirty"; echo "$tag"
  COMPOSE:
    sh: docker compose version >/dev/null 2>&1 && echo "docker compose" || echo "docker-compose"
  # The Terraform docker provider ignores Docker CLI contexts (Colima, Docker Desktop), so
  # resolve the active context's socket unless DOCKER_HOST is already set.
  DOCKER_HOST:
    sh: echo "${DOCKER_HOST:-$(docker context inspect | jq -r '.[0].Endpoints.docker.Host')}"
  CLUSTER_STACK: infra/environments/local/10-cluster
  PLATFORM_STACK: infra/environments/local/20-platform
  APPS_STACK: infra/environments/local/30-apps
  REGISTRY: localhost:5001

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install git hooks (pre-commit and commit-msg)
    cmds:
      - pre-commit install --install-hooks

  lint:
    desc: Run all linters and scanners on the whole repository
    cmds:
      - pre-commit run --all-files

  build:
    desc: Build the Notes API image tagged with the git SHA (push to the kind registry arrives in Phase 8)
    cmds:
      # Reproducible: timestamps come from the commit, and provenance attestations (which embed
      # build times) are off locally, so the same commit always yields the same digest and a
      # re-run of `task apps:up` is a no-op. CI publishes provenance/SBOM separately (Phase 11).
      - >-
        docker build app
        --tag {{.IMAGE}}:{{.IMAGE_TAG}}
        --provenance=false
        --build-arg VERSION={{.IMAGE_TAG}}
        --build-arg VCS_REF={{.VCS_REF}}
        --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
        --build-arg BUILD_DATE="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"

  push:
    desc: Build the image and push it to the kind local registry (localhost:5001)
    deps: [build]
    cmds:
      - docker tag {{.IMAGE}}:{{.IMAGE_TAG}} {{.REGISTRY}}/{{.IMAGE}}:{{.IMAGE_TAG}}
      - docker push --quiet {{.REGISTRY}}/{{.IMAGE}}:{{.IMAGE_TAG}}

  scan:
    desc: Lint the Dockerfile and scan the built image for HIGH/CRITICAL fixable vulnerabilities
    deps: [build]
    cmds:
      - hadolint app/Dockerfile
      - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 {{.IMAGE}}:{{.IMAGE_TAG}}

  app:test:
    desc: Run the Notes API unit and migration tests
    dir: app
    cmds:
      - uv run pytest

  app:lint:
    desc: Lint and format-check the Notes API code
    dir: app
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  chart:lint:
    desc: helm lint + kubeconform for every chart and environment overlay
    cmds:
      - scripts/validate-helm.sh

  chart:test:
    desc: Behavioural tests for the notes-api chart (render + assert, incl. rejected values)
    cmds:
      - uv run --no-project --with pytest --with pyyaml pytest tests/chart -q

  chart:docs:
    desc: Regenerate the notes-api chart README from values.yaml (helm-docs)
    dir: charts/notes-api
    cmds:
      - helm-docs --chart-search-root . --template-files README.md.gotmpl

  compose:up:
    desc: Start PostgreSQL → migrations → API with Docker Compose on http://127.0.0.1:8080
    dir: app
    cmds:
      # Throwaway local DB password, generated once and kept out of Git.
      - test -f .env || printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
      - IMAGE_TAG={{.IMAGE_TAG}} VCS_REF={{.VCS_REF}} {{.COMPOSE}} up -d --build

  compose:smoke:
    desc: Run the end-to-end checks against the Compose stack
    cmds:
      - IMAGE_TAG={{.IMAGE_TAG}} COMPOSE="{{.COMPOSE}}" tests/smoke/compose.sh

  compose:down:
    desc: Stop the Compose stack and keep the database volume
    dir: app
    cmds:
      - IMAGE_TAG={{.IMAGE_TAG}} {{.COMPOSE}} down

  compose:clean:
    desc: Stop the Compose stack and delete the database volume
    dir: app
    cmds:
      - IMAGE_TAG={{.IMAGE_TAG}} {{.COMPOSE}} down --volumes

  cluster:up:
    desc: Create the kind cluster and local registry (local/10-cluster). Extra args go to terraform apply, e.g. -- -auto-approve
    dir: "{{.CLUSTER_STACK}}"
    env:
      DOCKER_HOST: "{{.DOCKER_HOST}}"
    cmds:
      - terraform init -input=false
      - terraform apply {{.CLI_ARGS}}

  cluster:down:
    desc: Destroy the kind cluster and local registry (local/10-cluster). Extra args go to terraform destroy
    dir: "{{.CLUSTER_STACK}}"
    env:
      DOCKER_HOST: "{{.DOCKER_HOST}}"
    cmds:
      - terraform init -input=false
      - terraform destroy {{.CLI_ARGS}}
      # local_file removes hosts.toml but not the directories it created.
      - rm -rf .generated

  cluster:check:
    desc: Verify the running cluster (nodes, version, port mappings, registry mirror)
    cmds:
      - tests/infra/10-cluster.sh up

  cluster:check-clean:
    desc: Verify nothing from 10-cluster is left after cluster:down
    cmds:
      - tests/infra/10-cluster.sh down

  platform:up:
    desc: Install the platform add-ons (local/20-platform). Extra args go to terraform apply
    dir: "{{.PLATFORM_STACK}}"
    cmds:
      - terraform init -input=false
      - terraform apply {{.CLI_ARGS}}

  platform:down:
    desc: Uninstall the platform add-ons (local/20-platform). Extra args go to terraform destroy
    dir: "{{.PLATFORM_STACK}}"
    cmds:
      - terraform init -input=false
      - terraform destroy {{.CLI_ARGS}}

  platform:check:
    desc: Verify the platform (nodes Ready, releases, TLS, gateway, Grafana, logs)
    cmds:
      - tests/infra/20-platform.sh

  apps:up:
    desc: Push the image and deploy the database + Notes API (local/30-apps). Extra args go to terraform apply
    deps: [push]
    dir: "{{.APPS_STACK}}"
    cmds:
      - terraform init -input=false
      # Deploy by digest, read back from the registry, so a rebuilt "-dirty" tag is never stale.
      - >-
        terraform apply
        -var image_tag={{.IMAGE_TAG}}
        -var image_digest="$(curl -fsSI
        -H 'Accept: application/vnd.oci.image.index.v1+json'
        -H 'Accept: application/vnd.oci.image.manifest.v1+json'
        -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json'
        http://{{.REGISTRY}}/v2/{{.IMAGE}}/manifests/{{.IMAGE_TAG}}
        | awk 'tolower($1)=="docker-content-digest:" {print $2}' | tr -d '\r')"
        {{.CLI_ARGS}}

  apps:down:
    desc: Remove the Notes API and database (local/30-apps). Extra args go to terraform destroy
    dir: "{{.APPS_STACK}}"
    cmds:
      - terraform init -input=false
      - terraform destroy -var image_tag={{.IMAGE_TAG}} {{.CLI_ARGS}}

  apps:check:
    desc: Verify the database and the Notes API through the gateway
    cmds:
      - tests/infra/30-apps.sh

  up:
    desc: Create the whole local environment — 10-cluster → 20-platform → 30-apps. e.g. task up -- -auto-approve
    cmds:
      - task: cluster:up
      - task: platform:up
      - task: apps:up

  down:
    desc: Destroy the whole local environment — 30-apps → 20-platform → 10-cluster. e.g. task down -- -auto-approve
    cmds:
      - task: apps:down
      - task: platform:down
      - task: cluster:down

  test:
    desc: Run the validation suite against the running environment (Phase 9)
    cmds:
      - task: _not-implemented
        vars:
          PHASE: "9"

  _not-implemented:
    internal: true
    silent: true
    cmds:
      - echo "Not implemented yet — arrives in Phase {{.PHASE}} (see docs/project-plan.md)." >&2
      - exit 1
