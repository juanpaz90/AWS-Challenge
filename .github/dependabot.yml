# Keeps pinned versions current: action SHAs, image digests, Python lock, Terraform providers.
# Each update arrives as a PR and must pass the CI workflow (including e2e) before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup-toolchain"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: terraform
    directories: ["/infra/environments/local/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
