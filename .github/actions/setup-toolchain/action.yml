name: Setup toolchain
description: >-
  Installs the project's pinned CLI toolchain (same versions as the README prerequisites).
  Third-party actions are pinned to full commit SHAs.
inputs:
  e2e:
    description: Also install the end-to-end tools (kubectl, k6).
    default: "false"
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.16.0
        terraform_wrapper: false

    - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: v0.64.0

    - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: v0.75.0

    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.0

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.54.0

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: 0.12.24

    - name: kubeconform, hadolint, terraform-docs, helm-docs (checksum-verified)
      shell: bash
      run: scripts/ci/install-tools.sh

    - if: inputs.e2e == 'true'
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      with:
        version: v1.35.9

    - if: inputs.e2e == 'true'
      uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      with:
        k6-version: 2.3.0
