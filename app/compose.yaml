# Local smoke-test stack: PostgreSQL → one-shot migrations → API.
# Mirrors the Kubernetes rules: the database is not published on the host, the API runs
# non-root with a read-only root filesystem and no capabilities.
# DB_PASSWORD comes from app/.env (gitignored), generated by `task compose:up`.
name: notes-api

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: app
  DB_USER: app
  DB_PASSWORD: ${DB_PASSWORD:?run "task compose:up" to generate app/.env}
  LOG_LEVEL: INFO

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  db:
    # No `ports:` — the database is reachable only on the compose network.
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run "task compose:up" to generate app/.env}
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18+ images keep PGDATA under this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: notes-api:${IMAGE_TAG:-dev}
    build:
      context: .
      args:
        VERSION: ${IMAGE_TAG:-dev}
        VCS_REF: ${VCS_REF:-unknown}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      POD_NAME: migrate
    <<: *hardening
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: notes-api:${IMAGE_TAG:-dev}
    environment:
      <<: *app-env
      APP_MESSAGE: ${APP_MESSAGE:-Hello from Docker Compose}
    <<: *hardening
    ports:
      - "127.0.0.1:8080:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/readyz').status != 200)"
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
