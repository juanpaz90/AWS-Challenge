# Alembic config. The database URL is never stored here: migrations/env.py builds it from the
# same environment variables the API uses (DATABASE_URL or DB_*).
# Run with: alembic upgrade head
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
