[project]
name = "notes-api"
version = "0.1.0"
description = "Sample Notes API (FastAPI + PostgreSQL) for the AWS DevOps challenge"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "prometheus-client>=0.22",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.40",
    "uvicorn>=0.37",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works
